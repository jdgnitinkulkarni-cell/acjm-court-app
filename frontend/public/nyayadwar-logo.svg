<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="NyayDwar" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="ndBg" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#2a6a57"/>
      <stop offset="1" stop-color="#10302a"/>
    </radialGradient>
    <linearGradient id="ndGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d58f"/>
      <stop offset="0.55" stop-color="#c9a35e"/>
      <stop offset="1" stop-color="#9c7a3a"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#ndGold)"/>
  <circle cx="60" cy="60" r="53" fill="url(#ndBg)"/>
  <circle cx="60" cy="60" r="48.5" fill="none" stroke="url(#ndGold)" stroke-width="1.2" stroke-dasharray="2 3.2" opacity=".85"/>
  <g fill="url(#ndGold)" stroke="url(#ndGold)">
    <!-- finial -->
    <circle cx="60" cy="27.5" r="3.4" stroke="none"/>
    <!-- pillar -->
    <rect x="58.2" y="30" width="3.6" height="50" rx="1" stroke="none"/>
