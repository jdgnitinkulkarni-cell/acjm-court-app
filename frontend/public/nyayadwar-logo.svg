    <path d="M30 40 Q60 33 90 40" fill="none" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="30" cy="40" r="2.2" stroke="none"/>
    <circle cx="90" cy="40" r="2.2" stroke="none"/>
    <!-- chains -->
    <path d="M30 41 L21.5 62 M30 41 L38.5 62 M90 41 L81.5 62 M90 41 L98.5 62" fill="none" stroke-width="1.3"/>
    <!-- pans -->
    <path d="M19 62 H41 Q39.5 72 30 72 Q20.5 72 19 62 Z" stroke="none"/>
    <path d="M79 62 H101 Q99.5 72 90 72 Q80.5 72 79 62 Z" stroke="none"/>
